apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    basicAuth: false
    isDefault: true
    editable: true
    uid: ds-prometheus

  - name: Loki
    type: loki
    access: proxy
    orgId: 1
    url: http://loki:3100
    basicAuth: false
    editable: true
    uid: ds-loki

  - name: Tempo
    type: tempo
    access: proxy
    orgId: 1
    url: http://tempo:3200
    basicAuth: false
    editable: true
    uid: ds-tempo
    jsonData:
      tracesToLogsV2:
        datasourceUid: ds-loki
        filterByTraceID: true
        filterBySpanID: false
      tracesToMetrics:
        datasourceUid: ds-prometheus
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: ds-prometheus